name: Release website

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_GISCUS_CSS_RAW: ${{ vars.VITE_GISCUS_CSS_RAW }}
      VITE_BLOG_RAW: ${{ vars.VITE_BLOG_RAW }}
      VITE_NOVEL_RAW: ${{ vars.VITE_NOVEL_RAW }}
      VITE_COMMENT_COUNTS_API: ${{ vars.VITE_COMMENT_COUNTS_API }}
      VITE_RANDOM_HERO_API: ${{ vars.VITE_RANDOM_HERO_API }}
      VITE_ANALYTICS_API: ${{ vars.VITE_ANALYTICS_API }}
      VITE_SERVER_ADDRESS: ${{ vars.VITE_SERVER_ADDRESS }}
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          pnpm release verify "${GITHUB_REF_NAME#v}"

      - name: Build website
        run: pnpm build

      - name: Deploy website
        run: pnpm exec wrangler deploy --config wrangler.jsonc

      - name: Publish changelog
        run: pnpm changelog publish --yes
