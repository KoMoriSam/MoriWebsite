name: Promote or roll back website releases

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [promote, rollback]
        required: true
      release_id:
        description: Exact verified Release ID
        type: string
        required: true
      target:
        type: choice
        options: [rehearsal, production]
        default: rehearsal
        required: true

permissions:
  contents: read

concurrency:
  group: mori-release-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  validate-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Validate release metadata
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          pnpm install --frozen-lockfile
          pnpm release verify "${GITHUB_REF_NAME#v}"

  deploy:
    if: |
      github.event_name == 'workflow_dispatch' && (
      (inputs.target == 'production' && github.ref == 'refs/heads/main' && vars.MORI_RELEASE_PROMOTION_ENABLED == '1') ||
      (inputs.target == 'rehearsal' && github.ref_type == 'branch' && github.ref_name == vars.MORI_RELEASE_REHEARSAL_BRANCH))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target == 'rehearsal' && 'release-rehearsal' || 'production' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install locked Wrangler version
        run: |
          version="$(sed -nE 's/^  wrangler@([0-9]+\.[0-9]+\.[0-9]+):$/\1/p' pnpm-lock.yaml | sort -u)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm install --prefix "$RUNNER_TEMP/mori-wrangler" --no-save --no-package-lock --no-audit --no-fund "wrangler@$version"
          printf 'MORI_RELEASE_WRANGLER=%s\n' "$RUNNER_TEMP/mori-wrangler/node_modules/wrangler/bin/wrangler.js" >> "$GITHUB_ENV"
      - name: Deploy exact Release ID
        run: |
          if [ "$ACTION" = promote ]; then node scripts/release/artifact.mjs approve "$RELEASE_ID"; fi
          node scripts/release/artifact.mjs "$ACTION" "$RELEASE_ID"
          printf '### Website Release\n\n- Target: %s\n- Action: %s\n- Release ID: `%s`\n' "$MORI_RELEASE_MODE" "$ACTION" "$RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
        env:
          ACTION: ${{ inputs.action }}
          RELEASE_ID: ${{ inputs.release_id }}
          MORI_RELEASE_MODE: ${{ inputs.target }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RELEASE_R2_ENDPOINT: ${{ vars.RELEASE_R2_ENDPOINT }}
          RELEASE_R2_BUCKET: ${{ vars.RELEASE_R2_BUCKET }}
          RELEASE_R2_ACCESS_KEY: ${{ secrets.RELEASE_R2_ACCESS_KEY }}
          RELEASE_R2_SECRET_KEY: ${{ secrets.RELEASE_R2_SECRET_KEY }}
          RELEASE_CONTROL_R2_ENDPOINT: ${{ vars.RELEASE_CONTROL_R2_ENDPOINT }}
          RELEASE_CONTROL_R2_BUCKET: ${{ vars.RELEASE_CONTROL_R2_BUCKET }}
          RELEASE_CONTROL_R2_ACCESS_KEY: ${{ secrets.RELEASE_CONTROL_R2_ACCESS_KEY }}
          RELEASE_CONTROL_R2_SECRET_KEY: ${{ secrets.RELEASE_CONTROL_R2_SECRET_KEY }}
          RELEASE_APPROVAL_KEY: ${{ secrets.RELEASE_APPROVAL_KEY }}
          NOVEL_R2_ENDPOINT: ${{ inputs.target == 'production' && vars.NOVEL_R2_ENDPOINT || '' }}
          NOVEL_R2_BUCKET: ${{ inputs.target == 'production' && 'novel-vault' || '' }}
          NOVEL_R2_ACCESS_KEY: ${{ inputs.target == 'production' && secrets.NOVEL_R2_ACCESS_KEY || '' }}
          NOVEL_R2_SECRET_KEY: ${{ inputs.target == 'production' && secrets.NOVEL_R2_SECRET_KEY || '' }}
          STAGE_NOVEL_R2_ENDPOINT: ${{ inputs.target == 'rehearsal' && vars.STAGE_NOVEL_R2_ENDPOINT || '' }}
          STAGE_NOVEL_R2_BUCKET: ${{ inputs.target == 'rehearsal' && 'novel-vault-staging' || '' }}
          STAGE_NOVEL_R2_ACCESS_KEY: ${{ inputs.target == 'rehearsal' && secrets.STAGE_NOVEL_R2_ACCESS_KEY || '' }}
          STAGE_NOVEL_R2_SECRET_KEY: ${{ inputs.target == 'rehearsal' && secrets.STAGE_NOVEL_R2_SECRET_KEY || '' }}
          MORI_STAGE_ACCESS_CLIENT_ID: ${{ inputs.target == 'rehearsal' && secrets.MORI_STAGE_ACCESS_CLIENT_ID || '' }}
          MORI_STAGE_ACCESS_CLIENT_SECRET: ${{ inputs.target == 'rehearsal' && secrets.MORI_STAGE_ACCESS_CLIENT_SECRET || '' }}
