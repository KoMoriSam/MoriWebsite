name: Deploy branch Worker Preview

on:
  workflow_run:
    workflows: [Build branch preview]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  preview:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: branch-preview
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: wrangler.preview.jsonc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          name: preview-assets
          path: .output/preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - name: Install Preview-compatible Wrangler
        run: |
          mkdir -p "$RUNNER_TEMP/mori-preview"
          printf 'packages: []\nallowBuilds:\n  esbuild: true\n  workerd: true\n' > "$RUNNER_TEMP/mori-preview/pnpm-workspace.yaml"
          pnpm --dir "$RUNNER_TEMP/mori-preview" add --save-exact wrangler@4.160.1
      - name: Deploy static branch preview
        env:
          PREVIEW_REF: ${{ github.event.workflow_run.head_repository.full_name }}:${{ github.event.workflow_run.head_branch }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          if find .output/preview -type l -print -quit | grep -q .; then exit 1; fi
          find .output/preview -type f \( -name _redirects -o -name _headers -o -name '*.map' \) -delete
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n  X-Content-Type-Options: nosniff\n' > .output/preview/_headers
          branch_hash=$(printf '%s' "$PREVIEW_REF" | sha256sum | cut -c1-20)
          node "$RUNNER_TEMP/mori-preview/node_modules/wrangler/bin/wrangler.js" preview --ignore-base-config --config wrangler.preview.jsonc --name "branch-$branch_hash"
